# Nginx: 80-portdagi so'rovlarni gunicorn'ga (127.0.0.1:8000) uzatadi.
# Gunicorn tashqi tarmoqqa ochilmaydi — faqat nginx orqali.
server {
    listen 80 default_server;
    server_name _;

    # Hujjat yuklash limiti (Django'da 10 MB)
    client_max_body_size 12M;

    access_log /var/log/nginx/lamboerp_access.log;
    error_log  /var/log/nginx/lamboerp_error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
